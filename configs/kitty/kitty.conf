include ./theme.conf
# 字号按设备：font-size.conf 由 apply-kitty-font-size 在 X 会话初始化时生成
# （AMD Ryzen 7 7840 → 14.0，其它 → 12.0；KITTY_FONT_SIZE / /etc/kitty-font-size 可覆盖）
include ./font-size.conf

# 重置当前字号为初始值（kitty_mod 默认 Ctrl+Shift）
map kitty_mod+0 change_font_size all 0
# 滚动到顶部 / 底部
map kitty_mod+; scroll_home
map kitty_mod+' scroll_end