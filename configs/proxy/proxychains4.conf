# proxychains4 配置模板（部署到 /etc/proxychains4.conf）
# 说明：把命令强制走本机 shadowsocks 的本地 SOCKS5（127.0.0.1:1080）。
#       用法：proxychains4 -q <command>
#       例：proxychains4 -q curl -s https://api.ipify.org
# 注意：仅对动态链接、非 setuid 的程序有效；ssh 等可用 ProxyCommand 替代。

strict_chain

# DNS 也经代理解析（socks5 远程解析，等价 socks5h）
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 1080
