#### 第一阶段：最小可启动 Debian，目标盘 /dev/vda（= 宿主机 /dev/sdc）

### 语言 / 键盘（避免交互）
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/keymap select us
d-i keyboard-configuration/xkb-keymap select us
d-i user-setup/allow-password-weak boolean true

### 网络
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-usb
d-i netcfg/get_domain string localdomain
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### 镜像
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 时钟
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### 安装后系统的内核参数（串口控制台，便于 QEMU 验证）
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8

### 用户：启用 root 登录，不建普通用户（最小）
d-i passwd/root-login boolean true
d-i passwd/root-password password <ROOT_PASSWORD>
d-i passwd/root-password-again password <ROOT_PASSWORD>
d-i passwd/make-user boolean false

### 分区：GPT + ESP(FAT32) + ext4 root，仅动 /dev/vda
d-i partman-partitioning/default_label string gpt
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select usb
d-i partman-auto/expert_recipe string \
  usb :: \
    512 512 1024 fat32 \
      $iflabel{ gpt } \
      $reusemethod{ } \
      method{ efi } \
      format{ } \
    . \
    8000 12000 -1 ext4 \
      $primary{ } \
      $bootable{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
    .

d-i partman-basicfilesystems/no_swap boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/unmount_active boolean true

### apt
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security

### 包：最小，不选任何 task
tasksel tasksel/first multiselect
d-i pkgsel/upgrade select none
d-i pkgsel/install-recommends boolean false
popularity-contest popularity-contest/participate boolean false

### bootloader：GRUB(UEFI) 只装到 /dev/vda
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/vda

### 完成：自动关机，便于 QEMU 退出
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
d-i cdrom-detect/eject boolean true

